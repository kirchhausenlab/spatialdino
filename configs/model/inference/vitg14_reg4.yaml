ckpt_dir: ""

student:
  freeze_backbone: false
  arch: vit_giant2
  in_chans: 1
  patch_size: 14
  drop_path_rate: 0.4
  layerscale: 1.0e-05
  drop_path_uniform: true
  qkv_bias: true
  proj_bias: true
  ffn_bias: true
  ffn_layer: swiglufused
  num_register_tokens: 4
  block_chunks: 4
  interpolate_antialias: false
  interpolate_offset: 0.1

teacher:
  weights_path: ""
  momentum_teacher: 0.994
  final_momentum_teacher: 1
  warmup_teacher_temp: 0.04
  teacher_temp: 0.07
  warmup_teacher_temp_steps: 37500

crops:
  global_crops_size: ${model.training.crops.global_crops_size}
  local_crops_size: ${model.training.crops.local_crops_size}

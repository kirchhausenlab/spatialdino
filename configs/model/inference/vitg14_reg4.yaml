ckpt_dir: ""

student:
  freeze_backbone: true
  arch: vit_giant2
  in_chans: ${model.training.student.in_chans}
  patch_size: 14
  drop_path_rate: 0.4
  layerscale: 1.0e-05
  drop_path_uniform: true
  qkv_bias: true
  proj_bias: true
  ffn_bias: true
  ffn_layer: swiglufused
  num_register_tokens: 4
  block_chunks: 0
  interpolate_antialias: false
  interpolate_offset: 0.1

teacher:
  weights_path: ""

crops:
  global_crops_size: ${model.train.crops.global_crops_size}
  local_crops_size: ${model.training.crops.local_crops_size}

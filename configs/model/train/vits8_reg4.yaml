ckpt_dir: ""
resume: false
load_optim: true
output_dir: "output"

dino:
  freeze_head: false
  head_n_prototypes: 131072
  head_bottleneck_dim: 384
  loss_weight: 1.0
  head_nlayers: 3
  head_hidden_dim: 2048
  koleo_loss_weight: 0.0 # 0.1

ibot:
  freeze_head: false
  loss_weight: 1.0
  mask_sample_probability: 0.5
  mask_ratio_min_max:
    - 0.1
    - 0.5
  separate_head: false
  head_n_prototypes: 131072
  head_bottleneck_dim: 384
  head_nlayers: 3
  head_hidden_dim: 2048

student:
  freeze_backbone: false
  arch: vit_small
  in_chans: 1
  patch_size: 8
  drop_path_rate: 0.4
  layerscale: 1.0e-05
  drop_path_uniform: true
  qkv_bias: true
  proj_bias: true
  ffn_bias: true
  ffn_layer: swiglufused
  num_register_tokens: 4
  block_chunks: 0
  interpolate_antialias: false
  interpolate_offset: 0.1

teacher:
  momentum_teacher: 0.994
  final_momentum_teacher: 1
  warmup_teacher_temp: 0.04
  teacher_temp: 0.07
  warmup_teacher_temp_steps: 37500

crops:
  global_crops_scale:
    - 0.32
    - 1.0
  local_crops_number: 8
  local_crops_scale:
    - 0.05
    - 0.32
  global_crops_size: [48, 224, 224]
  local_crops_size: [16, 96, 96]

centering: sinkhorn_knopp

max_steps: 625000

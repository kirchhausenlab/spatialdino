# @package model._name_
student:
  arch: vit_giant2
  patch_size: 14
  layerscale: 1.0e-05
  block_chunks: 0
  qkv_bias: true
  proj_bias: true
  ffn_bias: true
  ffn_layer: swiglufused
  num_register_tokens: 4
  interpolate_antialias: true
  interpolate_offset: 0.0
crops:
  global_crops_size: 518 # this is to set up the position embeddings properly
  local_crops_size: 98
featup:
  upsampler:
    type: jbu_stack
    use_norm: true

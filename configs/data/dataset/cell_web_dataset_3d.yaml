train_dataset:
  _target_: cell_interactome.data.dino3d.dataset.make_webdataset
  base_data_dir: ""
  batch_size: 8
  resampled: true
  shardshuffle: true
  repeat: true
  cache_dir: null
  nodesplitter:
    _partial_: true
    _target_: webdataset.split_by_node

test_dataset:
  _target_: cell_interactome.data.dino3d.dataset.CellDataset3D
  base_data_dir: ""
  path_to_txt: ${data.dataset.test_dataset.base_data_dir}/data_paths_3D.txt
  max_files: 25000

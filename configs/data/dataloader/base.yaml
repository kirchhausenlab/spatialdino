train_dataloader:
  _target_: torch.utils.data.DataLoader
  batch_size: 50
  num_workers: 64
  pin_memory: true
  drop_last: true
  persistent_workers: true
  shuffle: false

sampler:
  sampler_type:
    _target_: cell_interactome.data.dinov2.dataloaders.SamplerType
    _args_:
      - 3
  size: -1
  advance: 0
  shuffle: true
  seed: ${seed}

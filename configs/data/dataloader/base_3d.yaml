train_dataloader:
  _target_: torch.utils.data.DataLoader
  batch_size: 64
  num_workers: 128
  pin_memory: false
  drop_last: true
  persistent_workers: true
  shuffle: false

sampler:
  sampler_type:
    _target_: cell_interactome.data.dino3d.dataloaders.SamplerType
    _args_:
      - 3
  size: -1
  advance: 0
  shuffle: true
  seed: ${seed}

train_dataloader:
  _target_: torch.utils.data.DataLoader
  batch_size: 16
  num_workers: 8 # workers per GPU
  pin_memory: false
  drop_last: true
  persistent_workers: false
  shuffle: false

sampler:
  sampler_type:
    _target_: cell_interactome.data.dino3d.dataloaders.SamplerType
    _args_:
      - 3
  size: -1
  advance: 0
  shuffle: true
  seed: ${seed}

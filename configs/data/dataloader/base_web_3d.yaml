train_dataloader:
  _target_: webdataset.WebLoader
  batch_size: null
  num_workers: 16 # workers per GPU
  pin_memory: true
  persistent_workers: true
  shuffle: false

test_dataloader:
  _target_: webdataset.WebLoader
  batch_size: null
  num_workers: 4 # workers per GPU
  pin_memory: true
  persistent_workers: true
  shuffle: false

sampler:
  sampler_type:
    _target_: cell_interactome.data.dino3d.dataloaders.SamplerType
    _args_:
      - 5
  size: -1
  advance: 0
  shuffle: true
  seed: ${seed}

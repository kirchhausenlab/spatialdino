defaults:
  - model: vitg14_reg4
  - ddp: fsdp
  - optim: adamw
  - train: vitg14_reg4
  - logging: wandb
  - _self_

seed: 0
base_path: /nfs/scratch2/shared_image_recog_ml
model_checkpoint_name: dinov2_vitg14_reg4_pretrain_ckpt

logging:
  use_wandb: true
  name: heads_pretrain
  log_preds: true
  log_pred_steps: 1000
  num_images: 10

model:
  weights: ${base_path}/weights/dinov2/pretrained/${model_checkpoint_name}.pth

evaluation:
  eval_period_steps: 12500

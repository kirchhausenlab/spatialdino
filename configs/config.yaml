defaults:
  - model/upsampler: jbu_stack
  - model/train: vits14_reg4
  - model/inference: vits14_reg4
  - training/distributed: fsdp
  - training/optim: adamw
  - training/scheduler: cosine
  - logging: wandb
  - data/collate_fn: collate_data_and_cast
  - data/dataloader: base
  - data/dataset: cell_dataset_2d
  - data/transforms: dino_2d
  - _self_

seed: 0
base_path: /nfs/scratch2/shared_image_recog_ml
experiment_name: dinov2_from_scratch

data:
  dataset:
    train_dataset:
      base_data_dir: ${base_path}/care_llsm_518

model:
  train:
    output_dir: ${base_path}/${experiment_name}/weights

inference:
  save_dir: ${base_path}/${experiment_name}/preds

defaults:
  - model/upsampler: jbu_stack_2d
  - model/train: vits16_reg4
  - model/inference: vits16_reg4
  - training/distributed: fsdp
  - training/optim: adamw
  - training/scheduler: cosine_2d
  - logging: wandb
  - data/collate_fn: collate_data_and_cast_2d
  - data/dataloader: base_2d
  - data/dataset: cell_dataset_2d
  - data/transforms: dino_2d
  - _self_

seed: 0
base_path: /nfs/scratch2/shared_image_recog_ml
experiment_name: dinov2_good_exp_vitbase_model

data:
  dataset:
    train_dataset:
      base_data_dir: ${base_path}/llsm_2d_ds

model:
  train:
    output_dir: ${base_path}/${experiment_name}/weights
    ckpt_dir: ""
    resume: false

inference:
  save_dir: /nfs/scratch1/ajain/cell_interactome/scripts/inference 
  img_path: /nfs/scratch1/ajain/cell_interactome/scripts/inference/sample.png

device: "cuda:2"
defaults:
  - model/train: vits8_reg4
  - model/inference: vits8_reg4
  - training/distributed: fsdp
  - training/optim: adopt
  - training/scheduler: cosine_3d
  - logging: wandb
  - data/collate_fn: collate_data_and_cast_3d
  - data/dataloader: base_web_3d
  - data/dataset: cell_web_dataset_3d
  - data/transforms: dino_3d
  - _self_

seed: 0
base_path: /nfs/scratch2/shared_image_recog_ml
experiment_name: dino3d_vits8_reg4

data:
  dataset:
    shards:
      - /raid1/shared_image_recog_ml/llsm_3d_ds_auto_crop/dataset-{000000..000868}.tar
      - /raid2/shared_image_recog_ml/llsm_3d_ds_auto_crop/dataset-{000000..000778}.tar
      - /raid3/shared_image_recog_ml/llsm_3d_ds_auto_crop/dataset-{000000..000768}.tar
    train_dataset:
      base_data_dir: "${data.dataset.shards[0]}::${data.dataset.shards[1]}::${data.dataset.shards[2]}"
      nodesplitter:
        node_file_counts: [869, 779, 769]
    test_dataset:
      base_data_dir: ${base_path}/llsm_3d_ds

model:
  train:
    output_dir: ${base_path}/weights/${experiment_name}
    ckpt_dir: "${base_path}/weights/${experiment_name}/step=15999.ckpt"
    resume: true

inference:
  save_dir: ${base_path}/preds/${experiment_name}

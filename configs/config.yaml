defaults:
  - model/train: vits8_reg4
  - model/inference: vits8_reg4
  - training/distributed: fsdp
  - training/optim: adopt
  - training/scheduler: cosine_3d
  - logging: wandb
  - data/collate_fn: collate_data_and_cast_3d
  - data/dataloader: base_3d
  - data/dataset: cell_dataset_3d
  - data/transforms: dino_3d
  - _self_

seed: 0
base_path: /nfs/scratch2/shared_image_recog_ml
experiment_name: dino3d_vits8_reg4

data:
  dataset:
    train_dataset:
      base_data_dir: ${base_path}/llsm_3d_ds_auto_crop
    test_dataset:
      base_data_dir: ${base_path}/llsm_3d_ds

model:
  train:
    output_dir: ${base_path}/${experiment_name}/weights
    ckpt_dir: "" # "${base_path}/${experiment_name}/weights/step=29999.ckpt"
    resume: false

inference:
  save_dir: ${base_path}/${experiment_name}/preds

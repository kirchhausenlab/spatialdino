defaults:
  - data/dataloader: base_web_3d # base_3d
  - data/dataset: cell_web_dataset_3d # cell_dataset_3d
  - training/optim: adopt
  - training/scheduler: cosine_3d_lift
  - _self_

seed: 42
output_base: /nfs/scratch2/shared_image_recog_ml
output_dir: ${output_base}/LiFT/backbone_vits_stride_8_adam_no_scheduler
model_type: dino3d
is_dino3d: true

training:
  use_additional_params: False
  add_scheduler: False
  start_epoch: 0
  max_steps: 100000

model:
  display_lr_feats: True
  stride: 14
  embed_dim: 1536
  patch_size: 14
  imsize: [48, 224, 224]
  global_crops: [48, 224, 224]
  loss_type: cosine
  dataroot: /nfs/scratch2/shared_image_recog_ml/weights/dino3d_vitg16_reg4_desd_loss/step=28999.ckpt/teacher_weights.pth
  in_chans: 1
  train:
    output_dir: ${output_dir}/weights
    ckpt_path: ""
    resume: false
    max_steps: ${training.max_steps}

student:
  arch: vit_giant2
  in_chans: 1
  patch_size: 16
  drop_path_rate: 0.4
  layerscale: 1.0e-05
  drop_path_uniform: true
  qkv_bias: true
  proj_bias: true
  ffn_bias: true
  ffn_layer: swiglufused
  num_register_tokens: 4
  block_chunks: 0
  interpolate_antialias: false
  interpolate_offset: 0.1

experiment_name: LiFT
logging:
  log_interval: 10
  save_interval: 1000
  pred_interval: 250 # 250
  num_pca_images: 4
  num_pred_images: 1
  project: cell-interactome
  entity: artificial-intelligence-research
  name: ${experiment_name}
  resume: false

data:
  chunk1: /raid1/shared_image_recog_ml/llsm_3d_ds_auto_crop/dataset-{000000..000868}.tar
  chunk2: /raid2/shared_image_recog_ml/llsm_3d_ds_auto_crop/dataset-{000000..000778}.tar
  chunk3: /raid3/shared_image_recog_ml/llsm_3d_ds_auto_crop/dataset-{000000..000768}.tar
  dataset:
    train_dataset:
      base_data_dir: ${data.chunk_1}::${data.chunk_2}::${data.chunk_3}
    test_dataset:
      base_data_dir: /raid1/shared_image_recog_ml/llsm_3d_ds/dataset-{000000..000919}.tar

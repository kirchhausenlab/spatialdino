in_chans: 1
global_crop_size: [112, 112, 112] # Global crop size for training
local_crop_size: [48, 48, 48] # Local crop size for training
patch_size: [8, 8, 8]
stride: [8, 8, 8]
embed_dim: 768
drop_path_rate: 0.4
layerscale: 1.0e-05
drop_path_uniform: true
qkv_bias: true
proj_bias: true
ffn_bias: true
ffn_layer: mlp
depth: 12
num_heads: 12
mlp_ratio: 4
num_register_tokens: 0
interpolate_offset: 0.1
interpolate_antialias: true
interpolate_align_corners: true
pos_embed_type: "none" # "sincos", "learned", "rope", "none"

# RoPE configuration (only used when pos_embed_type: "rope")
rope_theta: 100.0          # period base; ~100 for normalized coords, 10000 for raw positions
rope_normalize_coords: true  # map positions to [-1,+1]; critical for variable crop sizes
rope_coord_shift: null     # training augmentation: uniform shift per axis, e.g. 0.1
rope_coord_jitter: null    # training augmentation: log-uniform scale per axis, e.g. 1.5
rope_coord_rescale: null   # training augmentation: log-uniform global scale, e.g. 1.5


mean: [0.0] # [0.163] # [0.485, 0.456, 0.406]
std: [1.0] # [0.0988] # [0.229, 0.224, 0.225]

crop_size: [192, 192, 192] # Crop size for training
decoder_dropout: 0.65

[project]
name = "spatialdino"
version = "0.1.0"
description = "A self-supervised 3D Vision Transformer for segmentation and tracking in crowded cellular environments"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "Alex Lavaee", email = "lavaalex3@gmail.com"},
    {name = "Arkash Jain", email = "arkjain@bu.edu"},
    {name = "Gustavo Scanavachi"},
    {name = "Jose Inacio Costa-Filho", email = "jidacf@gmail.com"},
    {name = "Adam Ingemansson"},
    {name = "Tom Kirchhausen", email = "kirchhausen@crystal.harvard.edu"},
]
keywords = ["deep-learning", "computer-vision", "3d-vision", "self-supervised-learning", "microscopy", "segmentation", "tracking", "vision-transformer"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = [
    "click>=8.2.1",
    "matplotlib>=3.10.6",
    "monai>=1.4.0",
    "natsort>=8.4.0",
    "numba>=0.61.2",
    "omegaconf>=2.3.0",
    "openpyxl>=3.1.5",
    "pandas>=2.3.2",
    "pyclesperanto>=0.18.3",
    "pyparsing>=3.2.4",
    "rich>=14.1.0",
    "scikit-image>=0.25.2",
    "scikit-learn>=1.7.2",
    "stackview>=0.18.0",
    "torch>=2.8.0",
    "torch-pca>=1.1.0",
    "torchvision>=0.23.0",
    "tqdm>=4.67.1",
    "webdataset>=1.0.2",
    "xformers>=0.0.32.post2",
]

[project.urls]
Homepage = "https://github.com/kirchhausenlab/spatialdino"
Repository = "https://github.com/kirchhausenlab/spatialdino"
Documentation = "https://github.com/kirchhausenlab/spatialdino#readme"
"Bug Tracker" = "https://github.com/kirchhausenlab/spatialdino/issues"
Paper = "https://www.biorxiv.org/content/10.64898/2025.12.31.697247v2"

[project.optional-dependencies]
dev = [
    "mypy>=1.14.0",
    "pytest>=8.3.0",
    "pytest-cov>=6.0.0",
    "pre-commit>=4.0.0",
]

[tool.uv.workspace]
members = ["apps/server"]

[build-system]
requires = ["uv_build>=0.8.14,<0.11.0"]
build-backend = "uv_build"

# ---------------------------------------------------------------------------
# mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = false
warn_redundant_casts = true
warn_unused_ignores = false
no_implicit_optional = true
strict_equality = true
show_error_codes = true
show_column_numbers = true
pretty = true
namespace_packages = true
explicit_package_bases = true

[[tool.mypy.overrides]]
module = [
    "xformers.*",
    "monai.*",
    "webdataset.*",
    "omegaconf.*",
    "torch_pca.*",
    "pyclesperanto.*",
    "stackview.*",
    "skimage.*",
    "numba.*",
    "natsort.*",
    "scipy.*",
    "sklearn.*",
]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["apps/server/tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

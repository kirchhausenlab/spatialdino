[project]
name = "spatialdino"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "click>=8.2.1",
    "matplotlib>=3.10.6",
    "monai>=1.4.0",
    "natsort>=8.4.0",
    "numba>=0.61.2",
    "omegaconf>=2.3.0",
    "pandas>=2.3.2",
    "pyclesperanto>=0.18.3",
    "pyparsing>=3.2.4",
    "rich>=14.1.0",
    "scikit-image>=0.25.2",
    "scikit-learn>=1.7.2",
    "stackview>=0.18.0",
    "torch>=2.8.0",
    "torch-pca>=1.1.0",
    "torchvision>=0.23.0",
    "tqdm>=4.67.1",
    "webdataset>=1.0.2",
    "xformers>=0.0.32.post2",
]

[build-system]
requires = ["uv_build>=0.8.14,<0.9.0"]
build-backend = "uv_build"

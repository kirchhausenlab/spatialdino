[tool.poetry]
name = "cell-interactome"
version = "0.0.1"
description = ""
authors = [
    "Alex Lavaee <alavaee@tklab.hms.harvard.edu>",
    "Arkash Jain <ajain@tklab.hms.harvard.edu>",
]
license = "MIT"
readme = "README.md"
packages = [{ include = "cell_interactome", from = "src" }]

[tool.poetry.dependencies]
python = "^3.9"
torch = "^2.4.0"
torchvision = "^0.19.0"
torchaudio = "^2.4.0"
numpy = "^2.0.1"
tifffile = "^2024.7.24"
matplotlib = "^3.9.1.post1"
pandas = "^2.2.2"
seaborn = "^0.13.2"
loguru = "^0.7.2"
wandb = "^0.17.6"
ipykernel = "^6.29.5"
tqdm = "^4.66.5"
h5py = "^3.11.0"
loky = "^3.4.1"
imagecodecs = "^2024.6.1"
pillow = "^10.4.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.2"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[project]
name = "cell-interactome"
dynamic = ["version", "dependencies"]
description = ""
authors = [
    { name = "Alex Lavaee", email = "alavaee@tklab.hms.harvard.edu" },
    { name = "Arkash Jain", email = "ajain@tklab.hms.harvard.edu" },
]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.7"

[tool.setuptools.packages.find]
where = ["src"]
include = ["cell_interactome"]
namespaces = false

[tool.setuptools.dynamic]
version = { attr = "cell_interactome.__version__" }

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

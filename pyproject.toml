[project]
name = "cell-interactome"
version = "0.0.1"
description = "A foundation model for molecular biology."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch==2.4.0+cu121",
    "torchvision==0.2.0",
    "loguru>=0.7.2",
    "numpy>=1.26.3",
    "pandas>=2.2.2",
    "matplotlib>=3.9.2",
    "h5py>=3.11.0",
    "pillow>=10.2.0",
    "tqdm>=4.64.1",
    "featup",
]

[build-system]
requires = ["setuptools", "wheel", "ninja", "torch"]
build-backend = "setuptools.build_meta"

[tool.uv]
dev-dependencies = ["pytest>=8.3.2", "ruff>=0.6.2"]
extra-index-url = [
    "https://download.pytorch.org/whl/cu121",
    "https://pypi.nvidia.com",
]

[tool.uv.sources]
featup = { path = "src/third_party/FeatUp", editable = true }

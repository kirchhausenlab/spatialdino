[project]
name = "cell-interactome"
version = "0.0.1"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
# Main dependencies from requirements.txt
[tool.uv.dependencies]
torch = ">=2.4.0"
torchvision = ">=0.2.0"
omegaconf = "*"
torchmetrics = ">=1.0.3"
fvcore = "*"
iopath = "*"
xformers = ">=0.0.27.post2"
submitit = "*"
cuml-cu12 = "*"
setuptools = ">=70.0.0"

# Extra dependencies from requirements-extra.txt
[tool.uv.extras]
extra = [
    "ftfy",
    "regex",
    "mmcv>=2.2.0",
    "mmsegmentation @ git+https://github.com/kirchhausenlab/mmsegmentation.git",
]

# Additional configuration for extra index URLs
[[tool.uv.source]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu121"
type = "index"

[[tool.uv.source]]
name = "nvidia"
url = "https://pypi.nvidia.com"
type = "index"

[[tool.uv.source]]
name = "openmmlab"
url = "https://download.openmmlab.com/mmcv/dist/cu121/torch2.4/index.html"
type = "index"
